<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yession rich-editor harness</title>
    <!-- The real stylesheet, built beside the bundle by the `Browser`-cap test build. The
         shell below is the real `View.view`, and an unstyled one would make every layout
         this page is used to measure a fiction. -->
    <link rel="stylesheet" href="./out/assets/app.css" />
    <!-- The replay player's sheet, linked exactly as the shell links it: inert until
         `Replay.mount` flips its media. Here so the harness answers the same question the
         shell does — whether a mounted replay ends up styled — rather than an easier one. -->
    <link rel="stylesheet" href="./out/assets/player.css" media="not all" data-player-css />
  </head>
  <body>
    <!-- The editor mounts here; window.__md() returns the fragment's serialized Markdown.
         The bundle is the Fable-compiled app/browser/EditorHarness.fs, esbuilt by the
         `Browser`-cap test build (mise). No inline JS — the no-authored-JS invariant holds. -->
    <div id="host"></div>
    <!-- The replay of a recorded terminal mounts here (Plan 13, stage 3e): the same
         `asciinema-player` binding the client uses, driven by a `.cast` the client's own
         rebuild produced. -->
    <div id="replay"></div>
    <!-- A second recording, this one with a long idle gap in it and a chapter on the far
         side (Plan 25, stage 1). The mount above cannot fail the way the real pane failed:
         its recording has no dead air to compress and its one chapter sits at t=0, so a
         chapter list on the wrong clock still looks right. This one answers whether
         chapters and a start position ride the SAME clock as the records. -->
    <div id="replay-gappy"></div>
    <!-- Two peers converging on ONE body, relayed in this page: no WebRTC, no Session
         Process, no native addon. `#peer-a` is the author's editable composer, `#peer-b` the
         read-only mirror a co-editor sees. `window.__caretStorm(true)` pushes presence
         decorations into the mirror on every animation frame — which is what a real
         collaborator's moving caret does, and what the two-peer WebRTC E2E can only
         reproduce under load. -->
    <div id="peer-a"></div>
    <div id="peer-b"></div>
    <!-- The client shell (Plan 14, stage 2): the real `View.view` over a fixed model, with
         no Session Process behind it. Here to answer the two questions only a browser can —
         where focus goes when a chat chip opens a pane tab, and whether the tab strip is a
         tablist the arrow keys walk. -->
    <main id="shell"></main>
    <script type="module" src="./out/harness.js"></script>
  </body>
</html>
