# yession.yaml — what a session working on Yession selects.
#
# A repo's work sandbox is a CONTAINER (a repo-owned declaration without a `container:`
# block is refused): work runs in a full Linux userland, the same environment a person
# gets locally from this repo's flake. The TOOLCHAIN is devenv.nix's business (Node 24,
# .NET 10, Chromium, uv); the container brings only nix, and `nix develop` assembles the
# devshell from the checkout — one source of truth, no second copy of the toolchain here.
#
# The session bind-mounts its shared checkouts at /repos, so `workdir: .` is this repo's
# own checkout inside the container. Substitution comes from cache.nixos.org and the
# public yession cachix cache, named in NIX_CONFIG below: names, not paths, which is what
# keeps this file working on any machine. (First run on a fresh container is cold; the
# store warms via substitution, and an operator may offer a persistent store volume.)
#
# The session's own `default` sandbox is srt (light confinement for the checkout and
# small edits) and declares nothing here — no file may configure it.
version: 2

sandboxes:
  dev:
    workdir: .
    container:
      image: nixos/nix
      # Docker 29 resolves an exec's user through Go's os.Root guard, which refuses
      # the ABSOLUTE symlinks nix-built images use for /etc/passwd and /etc/group —
      # so `docker run` works and every `docker exec` dies with "path escapes from
      # parent". Materialising the two files at start (the run path, which works)
      # makes every later exec resolve against real files. Measured on 29.2.1;
      # remove when the daemon handles symlinked /etc again.
      cmd: |
        for f in passwd group shadow; do if [ -L /etc/$f ]; then cat /etc/$f > /etc/.$f && rm /etc/$f && mv /etc/.$f /etc/$f; fi; done; exec tail -f /dev/null
    forward: [ github ]              # so `git push` works from a terminal

    # Which nix features this repo's build needs, plus where its artifacts substitute
    # from. In the container this is the whole nix configuration the devshell sees —
    # there is no /etc/nix/nix.conf story to inherit, which is the point.
    #
    # The last two lines are what make nix RUN in this container at all: the sandbox
    # drops every capability, so multi-user store init (chown to nixbld) and nix's own
    # build sandbox both die on Operation not permitted. Single-user, unsandboxed nix
    # is the container norm — the container IS the sandbox. Measured under the exact
    # CapDrop ALL profile: store writes and a real derivation build both pass.
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-substituters = https://yession.cachix.org
        extra-trusted-public-keys = yession.cachix.org-1:Dj6jHWpEaqcGyrEEC3/qy/D3UQN8sZW1RXUOCRJ41oI=
        build-users-group =
        sandbox = false
      # The checkout arrives owned by the operator's uid while the container runs as
      # root, and git refuses to read a repository its caller does not own. These are
      # git's own env spelling of `safe.directory` — scoped to nothing narrower because
      # every repo this container can see is one this session put there. Without them
      # the three devenv.lock cases error with "could not read HEAD:devenv.lock".
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"

  # `verify` is minutes long. A second sandbox on the same configuration means the gate
  # runs beside interactive work instead of holding the shell.
  gate:
    workdir: .
    container:
      image: nixos/nix
      # Same Docker 29 os.Root workaround as `dev`.
      cmd: |
        for f in passwd group shadow; do if [ -L /etc/$f ]; then cat /etc/$f > /etc/.$f && rm /etc/$f && mv /etc/.$f /etc/$f; fi; done; exec tail -f /dev/null
    forward: [ github ]

    # The same reasons as `dev`; `like:` does not exist yet, so both are written twice.
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-substituters = https://yession.cachix.org
        extra-trusted-public-keys = yession.cachix.org-1:Dj6jHWpEaqcGyrEEC3/qy/D3UQN8sZW1RXUOCRJ41oI=
        build-users-group =
        sandbox = false
      # The checkout arrives owned by the operator's uid while the container runs as
      # root, and git refuses to read a repository its caller does not own. These are
      # git's own env spelling of `safe.directory` — scoped to nothing narrower because
      # every repo this container can see is one this session put there. Without them
      # the three devenv.lock cases error with "could not read HEAD:devenv.lock".
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
