name: release

# Trunk-based delivery: master is always production. Every push to master runs the full
# verification gate and, when green, publishes a GitHub release with the npm package
# tarball (`npm i -g` it; npm pulls the platform-native deps on install). Versions are
# GitVersion-style continuous delivery: 1.0.0-beta.<commits on master>, auto-incrementing.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  # Every PR: the cheap tier only — no browser, no ports, no credentials, fast.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Cheap test tier
        run: mise run test

  # Master pushes: the full verification gate (verify-tagged suites + browser E2E);
  # green verify is what publishes a release.
  verify:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install Chromium for the browser E2E
        run: npx --yes playwright@1.61.1 install --with-deps chromium
      - name: Full verification gate
        env:
          # Testing-scoped credential; enables the live agent smoke tests.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: mise run verify

  package:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit count IS the version
      - uses: jdx/mise-action@v2
      - name: Compute version (1.0.0-beta.<commit count>)
        id: version
        run: echo "version=1.0.0-beta.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: mise run build
      - name: Assemble the npm package (one package, two bins)
        run: mise exec -- dotnet fsi scripts/build.fsx ${{ steps.version.outputs.version }}
      # Prove a clean install of the published tarball pulls the platform-native deps
      # (node-datachannel's addon AND the SDK's native `claude`) and boots. This is the
      # real end-to-end check of "installing the package is all it takes".
      - name: Install smoke (native deps resolve; both surfaces serve)
        run: |
          tgz="$(ls dist/yession-*.tgz)"
          prefix="$(mktemp -d)"
          mise exec -- npm install --prefix "$prefix" "$tgz"
          test -f "$prefix/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude" \
            || (echo "native claude binary was not pulled by npm" && exit 1)
          test -f "$prefix"/node_modules/node-datachannel/build/Release/*.node \
            || (echo "node-datachannel addon was not built" && exit 1)
          YESSION_DATA_DIR="$(mktemp -d)" YESSION_PORT=0 YESSION_MANAGER_PORT=8321 \
            timeout 30 mise exec -- node "$prefix/node_modules/.bin/yession" | grep -q "management UI at" \
            || (echo "the installed package did not boot" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: dist-npm
          path: dist/*.tgz

  release:
    needs: package
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version
        id: version
        run: echo "version=1.0.0-beta.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Diff since previous release
        id: diff
        run: |
          prev_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"
          base=${prev_tag:-$(git rev-list --max-parents=0 HEAD)}
          git diff "$base"..HEAD -- . ':!*.md' > release-diff.txt
      - name: Draft release description with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read release-diff.txt, the diff between the previous release
            (${{ steps.diff.outputs.prev_tag || 'the repository start' }}) and this one.

            Write a concise release description: plain prose, 2-4 sentences, no
            heading, no bullet list. Describe what changed for someone using
            Yession, not implementation detail. If the diff alone leaves a
            change's effect ambiguous, read the surrounding source files
            before describing it.

            Write only the description text to RELEASE_NOTES.md, nothing else.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Write,Grep,Glob"
            --max-turns 15
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Yession ${{ steps.version.outputs.version }}
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: dist/*.tgz
