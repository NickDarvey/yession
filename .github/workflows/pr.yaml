name: pr

# Every pull request runs the cheap test tier — no browser, no ports, no credentials, fast.
# The full verification gate (verify-tagged suites + real-browser E2E) runs on master push in
# release.yml, which is what publishes a release.

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Cheap test tier
        run: mise run test
