name: pr

# Every pull request runs the capabilities a PR runner can satisfy WITHOUT the native
# node-datachannel addon: the cheap tier plus the host-free rich-editor browser E2E
# (`-- Browser` needs only Chromium). The full gate — the WebRTC/host suites (`Native`),
# Docker, and the live-agent smoke — needs the addon/daemon/credentials and runs on master
# push in release.yml (`mise run verify`), which is what publishes a release.

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # Chromium for the host-free editor E2E (the .NET Playwright driver drives it).
      - name: Install Chromium for the editor E2E
        run: npx --yes playwright@1.61.1 install --with-deps chromium
      - name: Cheap tier + host-free editor browser E2E
        run: mise run test -- Browser
