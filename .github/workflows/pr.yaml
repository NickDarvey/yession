name: pr

# Every pull request runs everything a PR runner can satisfy without a Docker daemon or live
# model credentials: the cheap tier, the host-free rich-editor browser E2E, AND the native
# WebRTC/host suites — the two-peer browser convergence E2E and the Node WebRTC/host E2Es
# (`Native` + `Ports`). Only `Docker` (needs a daemon) and `LiveAgent` (needs real
# credentials) stay release-only; release.yml's `verify` runs the complete gate.
#
# `darwin-package` is the second job and the only non-Linux one: it builds the flake package
# on macOS so the darwin systems flake.nix advertises are actually exercised. See its own
# comment for why Linux CI structurally cannot catch what it catches.
#
# The dev environment is devenv (Node 24, .NET SDK 10) so CI and local dev are identical.
# `check` (devenv script) restores deps with `--ignore-scripts` and links the Nix-built
# node-datachannel WebRTC addon — the same addon local dev uses, so the Native tier is
# byte-identical here and on a laptop. GitHub runners have full GitHub access, so devenv's
# `github:cachix/devenv` input resolves natively (no cache-substitution override needed).
#
# The gate runs once — no retry crutch. The native WebRTC suites used to abort intermittently, but
# that was a real defect (the node-datachannel addon linked its own static C++ runtime and aborted
# when a shared-libdatachannel exception crossed the NAPI boundary; fixed in nix/node-datachannel.nix
# by linking the addon against the shared runtime). A failure here is now a genuine break.

on:
  pull_request:
    branches: [master]
  # A merge queue builds base+PR on a temporary ref and dispatches `merge_group` — a required
  # check that does not run on that event never reports, so every queued pull request sits
  # until it times out and is kicked back out. This trigger is a no-op until a queue exists,
  # and it has to be in place BEFORE one is turned on: the failure mode of getting that order
  # wrong is that nothing can merge at all.
  merge_group:

# One run per pull request. A push supersedes the run it obsoletes, and there is no reason to
# keep paying for a verdict on a commit nobody will merge: 30 of the last 244 runs were still
# executing when the next push to their own branch started, for 215 wall-minutes spent on
# answers about superseded commits.
#
# `merge_group` has no `pull_request` payload, so the group falls back to `run_id` — unique per
# run, a group of one, which nothing can ever cancel. That fallback IS the merge-queue guard,
# and it is the only one: making `cancel-in-progress` conditional as well would be a second
# mechanism for the same requirement, and the next reader could not tell which one was load
# bearing. A queued pull request whose check gets cancelled never reports and sits until it is
# kicked back out, so this is the sharp edge worth being explicit about.
#
# release.yml has its own group with `cancel-in-progress: false`, for the opposite reason: a
# master run must always finish and publish. Superseding is right here and wrong there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # A binary cache for the derivations no public one can serve: OURS. The expensive ones do
      # not depend on the app source at all — libdatachannel and node-datachannel are C++ builds
      # keyed on nix/node-datachannel.nix, node_modules on package-lock.json — so they are
      # byte-identical from one pull request to the next and were compiled from scratch on every
      # run (~1.2 min of the step below was `Building CXX object`). Nix keys by derivation hash,
      # so a source change still rebuilds and a stale entry is never consulted: this can miss, it
      # cannot serve a wrong answer.
      #
      # This job PUSHES as well as reads, and so does darwin, because a job publishing what it
      # built is the only rule that covers both. release.yml has no darwin job, so aarch64-darwin
      # paths are built nowhere but here — a read-only PR tier would leave the darwin half of the
      # cache permanently empty. Fork pull requests get no secret, so they read and skip the push.
      - uses: cachix/cachix-action@v17
        with:
          name: yession
          # devenv's own cache, and the reason this is here rather than in `extra_nix_config`
          # above: install-nix-action writes /etc/nix/nix.conf, cachix-action writes
          # ~/.config/nix/nix.conf, and the user file REPLACES the substituter list rather than
          # appending to it. Naming devenv there and yession here silently dropped devenv — the
          # darwin dev-shell step went 0m51s back to 16m11s, recompiling all 872 derivations.
          # So one file owns substituters, and everything we pull from is named in it.
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      # First, and cheap: source judged without running it. actionlint over .github/workflows —
      # release.yml only runs on master, so nothing else here would notice it was broken until
      # after a merge, which is exactly how a colon-space in an unquoted step name once took
      # every master release down at startup — and then the F# analyzers, which read the typed
      # tree for what a Lit template hole renders (nothing the compiler will say; see
      # analyzers/Yession.Analyzers/TemplateHoles.fs).
      - name: Lint the workflows and analyze the templates
        run: devenv shell -- lint
      # srt's strict profile drops capabilities and mounts a fresh /proc through a NESTED user
      # namespace, and Ubuntu 24.04 ships `kernel.apparmor_restrict_unprivileged_userns=1`,
      # which forbids exactly that — so the first run of the sandbox probes here dropped the
      # `Srt` capability and skipped, leaving the confining backend with no CI coverage at all.
      # The runner is an ephemeral VM and nothing about the product changes; `|| true` keeps a
      # runner image without the knob working, and `check` then drops the capability with its
      # own line rather than failing.
      - name: Permit nested user namespaces (the sandbox escape probes need them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # `check` does everything Yession-specific: restore + link the addon, provision Chromium
      # for the browser E2Es, and run the gate.
      # `Srt` is here rather than only in `verify` because the escape probes are the whole
      # point of the confining backend and they run in seconds. `check` probes for a WORKING
      # bubblewrap first and drops the capability (with a line saying so) where the kernel
      # refuses one, so this cannot fail a PR on a runner that cannot host it.
      # `Serial` for the same reason and at the same price: the dev shell brings socat and
      # udevadm on Linux, and the engine suite is under a second. A tier that only runs after
      # a merge is a tier nobody fixes before one.
      # `Jumpstarter` on the same argument, at a higher price: it resolves the example's
      # locked Python environment (a wheel fetch on a cold runner) and then runs two child
      # processes per test. Worth it — that suite is the only place our MCP client is driven
      # against a server nobody here wrote, and a break in it is a break in the contract the
      # whole examples directory advertises.
      - name: Cheap tier + browser + native WebRTC/host E2E + sandbox escape probes + serial + jumpstarter
        run: devenv shell -- check Browser Ports Native Srt Serial Jumpstarter

  # What a person waits for, and whether this pull request made it worse. Its own job, parallel
  # to `test`, so it costs nothing on the gate's critical path — and blocking, because a
  # regression should be caught by the person who caused it rather than read off a chart weeks
  # later. Only a BIG one fails (3x a baseline that is the median of the last ten releases); the
  # thresholds and the reasoning are in tasks.fsx.
  #
  # It does NOT record. The history is master's, and a pull request measuring itself into it
  # would make the baseline a average of everything anybody ever tried.
  bench:
    uses: ./.github/workflows/bench.yml
    with:
      guard: true
      record: false
    secrets: inherit

  # The installable package, built on macOS. flake.nix advertises aarch64-darwin and
  # x86_64-darwin and nix/node-datachannel.nix claims platforms.unix, but every other job
  # here is ubuntu-latest — so the darwin build went unexercised, and silently unbuildable:
  # an ELF link tolerates the undefined napi_* in a shared object and resolves them against
  # the hosting Node at load time, while Mach-O rejects them outright. No amount of Linux CI
  # can see that. This job is the guard.
  darwin-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Same argument as the Linux job, and this is the job that needed a real cache rather than
      # the Actions cache. Backed by the latter, the darwin run was throttled — `error 418`,
      # "GitHub Actions Cache throttled Magic Nix Cache. Not trying to use it again on this run."
      # — and one 418 disables it for the whole run. So a warm darwin run compiled 99 CXX objects,
      # exactly as many as a cold one, while Linux went 99 -> 0. Two jobs sharing one repository's
      # Actions cache is what provoked it, and no amount of retrying fixes a rate limit.
      - uses: cachix/cachix-action@v17
        with:
          name: yession
          # devenv's own cache, and the reason this is here rather than in `extra_nix_config`
          # above: install-nix-action writes /etc/nix/nix.conf, cachix-action writes
          # ~/.config/nix/nix.conf, and the user file REPLACES the substituter list rather than
          # appending to it. Naming devenv there and yession here silently dropped devenv — the
          # darwin dev-shell step went 0m51s back to 16m11s, recompiling all 872 derivations.
          # So one file owns substituters, and everything we pull from is named in it.
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Deliberately `nix build` and not devenv: this is the `nix profile install
      # github:trinketworks/yession` path a user actually takes, and it must stay pure.
      - name: Build the installable package
        run: nix build .#yession --print-build-logs
      # The other darwin blind spot, and the same shape as the one above: `nix build`
      # evaluates nix/packages.nix, never `devShells`, so nothing on any runner had ever
      # evaluated the DEV SHELL on macOS. A package with no darwin build could therefore sit
      # in devenv.nix's `packages` with every job green while `devenv shell` — the documented
      # way in — could not be entered on a Mac at all. It could and it did: gnome-keyring,
      # which nixpkgs refuses to evaluate off Linux, so the failure was at evaluation and no
      # test had to run to be affected. Entering it is the check; the Linux job above is what
      # actually runs the suite.
      - name: The dev shell is enterable on darwin
        run: DEVENV_ROOT="$PWD" nix develop --impure --command bash -c 'dotnet --version && node --version'
      # A successful link is not a successful load. `-undefined dynamic_lookup` defers every
      # napi_* symbol to load time, so the link above would still pass if the addon were
      # unloadable. Require it to load and construct a peer connection for real.
      #
      # `--inputs-from .` resolves `nixpkgs` through THIS flake's lock — the one the build above
      # already fetched and realised. Without it, the bare `nixpkgs#` reference goes to the
      # registry's nixpkgs-unstable CHANNEL, which is a different nixpkgs from the locked one:
      # the runner downloaded and unpacked a second, entire nixpkgs into the git cache (124s in
      # the run this was measured on) to get a `node` the locked one already had. It is also the
      # node the package itself runs on — nix/packages.nix wraps `${pkgs.nodejs_24}/bin/node` —
      # so the smoke test now loads the addon under the same interpreter that ships it, which is
      # the interpreter the claim is about.
      #
      # Teardown is the product's own sequence (app/WebRtc.fs `closePeerConnection`, and the
      # `Interop.cleanup ()` the suites run after draining every connection): close, WAIT for
      # libdatachannel to report CLOSED — its own signal that its threads are finished with
      # the object — then the global cleanup, then let node exit on its own. `pc.close()` is
      # not synchronous, so `close(); process.exit(0)` tears the process down while native
      # threads still hold the connection. That is a SIGSEGV on the way out, after the check
      # has already printed its pass, and it took this job red on darwin. It is the same
      # crash the Node suite hit (the SIGSEGV of verify run 30137017551) and fixed the same
      # way; this script was the last place still exiting into live threads.
      #
      # The wait is bounded and loud: a connection that never reports closed fails the step
      # with a reason rather than hanging until the job timeout.
      - name: The native WebRTC addon loads
        run: |
          cat > "$RUNNER_TEMP/addon-smoke.cjs" <<'EOF'
          const m = require(`${process.cwd()}/result/libexec/yession/node_modules/node-datachannel`);
          const pc = new m.PeerConnection('ci', { iceServers: [] });
          console.log('addon loaded; PeerConnection state:', pc.state());
          const closed = new Promise((resolve, reject) => {
            if (pc.state() === 'closed') return resolve();
            pc.onStateChange((state) => { if (state === 'closed') resolve(); });
            setTimeout(() => reject(new Error('the connection never reported closed')), 10000).unref();
          });
          pc.close();
          closed.then(
            () => { m.cleanup(); console.log('addon torn down cleanly'); },
            // A live connection keeps the loop alive, so setting an exit CODE here would
            // hang the step for its whole timeout with the diagnosis already printed. The
            // hard exit is what the happy path must never do and this path must: the step
            // is failing either way, and the reason is on stderr before the process goes.
            (error) => { console.error(String(error)); process.exit(1); });
          EOF
          nix shell --inputs-from . nixpkgs#nodejs_24 --command node "$RUNNER_TEMP/addon-smoke.cjs"
