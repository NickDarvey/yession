name: pr

# Every pull request runs everything a PR runner can satisfy without a Docker daemon or live
# model credentials: the cheap tier, the host-free rich-editor browser E2E, AND the native
# WebRTC/host suites — the two-peer browser convergence E2E and the Node WebRTC/host E2Es
# (`Native` + `Ports`). Only `Docker` (needs a daemon) and `LiveAgent` (needs real
# credentials) stay release-only; release.yml's `just verify` runs the complete gate and is
# what publishes a release.
#
# The toolchain comes from the Nix flake (Node 24, .NET SDK 10, just) so CI and local dev use
# the exact same versions. `just restore` installs deps with `--ignore-scripts` and links the
# Nix-built node-datachannel WebRTC addon (packages.node-datachannel) into node_modules — the
# same addon local dev uses, so the Native tier is byte-identical here and on a laptop.
#
# The native WebRTC suites gather ICE in a sandbox and occasionally flake (an ICE stall, or a
# toolchain segfault mid-compile), so the gate is retried once before it is called a failure:
# a genuine break fails both attempts; a transient one clears on the retry.

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Deps + the Nix-built node-datachannel addon (linked by `just restore`). Chromium drives
      # both the host-free editor E2E and the two-peer browser convergence E2E via the .NET
      # Playwright driver.
      - name: Restore deps (links the Nix node-datachannel addon)
        run: nix develop --command just restore
      - name: Install Chromium for the browser E2Es
        run: nix develop --command npx --yes playwright@1.61.1 install --with-deps chromium
      - name: Cheap tier + browser + native WebRTC/host E2E (retry once on flake)
        run: |
          for attempt in 1 2; do
            echo "::group::native gate — attempt $attempt"
            if nix develop --command just test Browser Ports Native; then
              echo "::endgroup::"
              echo "native gate passed on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "native gate failed on attempt $attempt"
          done
          echo "native gate failed after 2 attempts — treating as a real failure"
          exit 1
