# mise — the repository interface.
#
# Everything goes through `mise run <task>`. See `mise tasks` for the list.
# Toolchain is pinned for reproducibility; bump deliberately.

[tools]
# Browser Client (F#/Fable) + Session Process (F# on Node) both run on Node.
node = "24.16.0"
# F# toolchain. Fable compiles F# -> JS; the domain library and tests build on .NET.
dotnet = "10.0.301"

[env]
# Keep tool-installed binaries (Fable, etc.) on PATH within tasks.
_.path = ["{{config_root}}/node_modules/.bin"]

# --- Tasks: the repo's public interface -------------------------------------

[tasks.restore]
description = "Install all dependencies (npm + .NET tools)."
run = [
  "npm install",
  "dotnet tool restore",
]

[tasks.build]
description = "Build everything: type-check (.NET) and Fable-compile the Session Process host."
depends = ["restore"]
run = [
  "dotnet build Yession.slnx",
  "dotnet fable app/main/Yession.Host.Main.fsproj -o app/out",
]

[tasks.start]
description = "Start the Session Process locally (http://127.0.0.1:8080)."
depends = ["build"]
run = "node app/out/Main.js"

[tasks.dev]
description = "Run the Session Process in watch mode (recompiles and restarts on change)."
depends = ["restore"]
run = "dotnet fable watch app/main/Yession.Host.Main.fsproj -o app/out --runWatch node app/out/Main.js"

[tasks.test]
description = "Run the full test suite (Pyxpecto, compiled by Fable, on Node)."
depends = ["restore"]
run = [
  "dotnet build Yession.slnx",
  "dotnet fable tests/Yession.Tests/Yession.Tests.fsproj -o tests/Yession.Tests/out",
  "node tests/Yession.Tests/run.mjs tests/Yession.Tests/out/Main.js 120000",
]

[tasks.clean]
description = "Remove build artifacts and installed dependencies."
run = [
  "rm -rf node_modules",
  "rm -rf app/out tests/Yession.Tests/out",
  "find . -type d -name bin -prune -exec rm -rf {} +",
  "find . -type d -name obj -prune -exec rm -rf {} +",
  "find . -type d -name fable_modules -prune -exec rm -rf {} +",
]
